<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mənim ilk saytım</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="profile.jpg.png" alt="Profil şəkli">
        <h1>👋 Salam! Mənim ilk saytım</h1>      

    <p>Mən 11 yaşında proqramlaşdırma öyrənirəm.</p>
    <button onclick="alert('hi welcome to my website!')">Saytıma xoş gəlmisən</button>
    <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    <p>Mən HTML və CSS öyrənirəm 🚀</p>
    <p>Bu mənim ilk mini layihəmdir ✨</p>
    <h2>Mənim hobbilərim</h2>

    <ul>
        <li>🎮 Oyun oynamaq</li>
        <li>💻 Kod yazmaq</li>
        <li>⚽ Futbol</li>
    </ul>

        <button onclick="openSnakeGame()">🎮 Oyun oyna</button>

<div id="gameArea" class="game-area">
    <h2>🐍 İlan Oyunu</h2>
    <p id="score">Score: 0</p>
    <p id="highScore">High Score: 0</p>

    <canvas id="snakeGame" width="300" height="300"></canvas>

    <div class="game-controls">
        <button onclick="changeDirection('up')">⬆️</button>

        <div>
            <button onclick="changeDirection('left')">⬅️</button>
            <button onclick="changeDirection('down')">⬇️</button>
            <button onclick="changeDirection('right')">➡️</button>
        </div>
    </div>

    <button onclick="startGame()">🔄 Yenidən başla</button>
</div>

</div>
<script>
function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
}
</script>
<script>
const canvas = document.getElementById("snakeGame");
const ctx = canvas.getContext("2d");

const box = 20;

let snake;
let food;
let goldenFood = null;
let goldenTimer = null;
let direction;
let nextDirection;
let gameLoop;
let score = 0;
let highScore = localStorage.getItem("highScore") || 0;
let speed = 180;

document.getElementById("highScore").textContent =
    "High Score: " + highScore;

function openSnakeGame() {
    const gameArea = document.getElementById("gameArea");

    if (gameArea.style.display === "block") {
        gameArea.style.display = "none";
        clearInterval(gameLoop);
    } else {
        gameArea.style.display = "block";
        startGame();
    }
}

function startGame() {
    clearInterval(gameLoop);
    score = 0;
    speed = 260;

document.getElementById("score").textContent = "Score: 0";

gameLoop = setInterval(drawGame, speed);
    score = 0;
document.getElementById("score").textContent = "Score: 0";
speed = 260;

    snake = [
        { x: 140, y: 140 },
        { x: 120, y: 140 },
        { x: 100, y: 140 }
    ];

    direction = "right";
    nextDirection = "right";

    createFood();

    gameLoop = setInterval(drawGame, 130);
}

function createFood() {
    food = {
        x: Math.floor(Math.random() * 15) * box,
        y: Math.floor(Math.random() * 15) * box
    };

    for (const part of snake) {
        if (part.x === food.x && part.y === food.y) {
            createFood();
            return;
        }
    }
}

function createGoldenFood() {
    goldenFood = {
        x: Math.floor(Math.random() * 15) * box,
        y: Math.floor(Math.random() * 15) * box
    };

    clearTimeout(goldenTimer);

    goldenTimer = setTimeout(() => {
        goldenFood = null;
    }, 5000);
}

function changeDirection(newDirection) {
    if (newDirection === "left" && direction !== "right") {
        nextDirection = "left";
    }

    if (newDirection === "right" && direction !== "left") {
        nextDirection = "right";
    }

    if (newDirection === "up" && direction !== "down") {
        nextDirection = "up";
    }

    if (newDirection === "down" && direction !== "up") {
        nextDirection = "down";
    }
}
document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft") {
        event.preventDefault();
        changeDirection("left");
    }

    if (event.key === "ArrowRight") {
        event.preventDefault();
        changeDirection("right");
    }

    if (event.key === "ArrowUp") {
        event.preventDefault();
        changeDirection("up");
    }

    if (event.key === "ArrowDown") {
        event.preventDefault();
        changeDirection("down");
    }

});
function drawGame() {
    direction = nextDirection;

    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(
        food.x + box / 2,
        food.y + box / 2,
        box / 2 - 2,
        0,
        Math.PI * 2
    );
    ctx.fill();
    if (goldenFood) {
    ctx.fillStyle = "gold";
    ctx.beginPath();

    ctx.arc(
        goldenFood.x + box / 2,
        goldenFood.y + box / 2,
        box / 2 - 2,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

    for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#00ff66" : "#00bb55";
        ctx.fillRect(
            snake[i].x + 1,
            snake[i].y + 1,
            box - 2,
            box - 2
        );
    }

    let headX = snake[0].x;
    let headY = snake[0].y;

    if (direction === "left") headX -= box;
    if (direction === "right") headX += box;
    if (direction === "up") headY -= box;
    if (direction === "down") headY += box;

    if (
        headX < 0 ||
        headY < 0 ||
        headX >= canvas.width ||
        headY >= canvas.height ||
        collision(headX, headY)
    ) {
        clearInterval(gameLoop);

        ctx.fillStyle = "white";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Game Over 😭", canvas.width / 2, canvas.height / 2);

        return;
    }

    const newHead = {
        x: headX,
        y: headY
    };
    
    if (
    goldenFood &&
    headX === goldenFood.x &&
    headY === goldenFood.y
) {
    score += 5;

    document.getElementById("score").textContent =
        "Score: " + score;

    if (score > highScore) {
        highScore = score;
        localStorage.setItem("highScore", highScore);

        document.getElementById("highScore").textContent =
            "High Score: " + highScore;
    }

    goldenFood = null;
    clearTimeout(goldenTimer);
}

   if (headX === food.x && headY === food.y) {
    score++;

    if (score % 5 === 0) {
        createGoldenFood();
    }

    document.getElementById("score").textContent =
        "Score: " + score;

    if (score > highScore) {
        highScore = score;

        localStorage.setItem("highScore", highScore);

        document.getElementById("highScore").textContent =
            "High Score: " + highScore;
    }

  
    createFood();
} else {
    snake.pop();
}

    snake.unshift(newHead);

}
function collision(x, y) {
    for (const part of snake) {
        if (part.x === x && part.y === y) {
            return true;
        }
    }

    return false;
}
</script>
</body>
</html>
